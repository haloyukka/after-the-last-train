<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>終電のあと / After the Last Train</title>
  <meta name="description" content="灯りを持って、雨の深夜の街を歩き続けるブラウザ上の3D体験。">
  <meta name="theme-color" content="#05060c">
  <meta name="color-scheme" content="dark">
  <link rel="stylesheet" href="./style.css">

  <!-- Three.js はバージョンを固定してCDNから読み込む -->
  <script type="importmap">
  {
    "imports": {
      "three": "https://cdn.jsdelivr.net/npm/three@0.187.0/build/three.module.js",
      "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.187.0/examples/jsm/"
    }
  }
  </script>
</head>
<body>
  <canvas id="scene" aria-label="深夜の街を歩く3Dの風景"></canvas>

  <div id="overlay">
    <h1 class="title">終電のあと</h1>
    <p class="subtitle">After the Last Train</p>
    <button id="start" type="button" disabled>読み込み中…</button>
    <p id="message" class="message" hidden></p>
  </div>

  <p id="hint" class="hint" role="status"></p>

  <button id="help" type="button" class="corner-button corner-button--second" aria-label="操作説明" hidden>
    <svg viewBox="0 0 24 24" width="22" height="22" aria-hidden="true" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round">
      <path d="M9.2 9.2a2.9 2.9 0 1 1 4.3 2.5c-.9.5-1.5 1.1-1.5 2.3"/>
      <path d="M12 17.5v.1"/>
    </svg>
  </button>

  <button id="sound" type="button" class="corner-button" aria-label="音を切る" data-muted="false" hidden>
    <svg viewBox="0 0 24 24" width="22" height="22" aria-hidden="true" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round">
      <path d="M4 9.5h3l4.5-4v13l-4.5-4H4z"/>
      <g class="sound-on"><path d="M15 9a4 4 0 0 1 0 6"/><path d="M17.5 6.5a8 8 0 0 1 0 11"/></g>
      <g class="sound-off"><path d="M15.5 9.5l5 5"/><path d="M20.5 9.5l-5 5"/></g>
    </svg>
  </button>

  <noscript>
    <p class="noscript">このページの表示には JavaScript と WebGL が必要です。</p>
  </noscript>

  <script type="module" src="./src/main.js"></script>
</body>
</html>
